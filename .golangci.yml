version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - unconvert
  settings:
    errcheck:
      # Writes to stdout/stderr/buffers: nothing useful to do on failure.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
formatters:
  enable:
    - gofmt
